data_dir: tmp/vector

sources:
  ap_log_files:
    type: file
    include:
      - /app/log/web_*.log
    read_from: end
    file_key: path
    multiline:
      start_pattern: '^\[.*\]\s\s\s\[.*\]\s\[TRACE\]\sbefore\sSysUuid::set\(\):\scurSysUuid=.*'
      condition_pattern: '^\[.*\]\s\s\s\[.*\]\s\[TRACE\]\sbefore\sSysUuid::set\(\):\scurSysUuid=.*'
      mode: halt_before
      timeout_ms: 1000

transforms:
  parse_fields:
    type: remap
    inputs:
      - ap_log_files
    source: |
      .system = "ledgendary"
      .type = "ap_log"

      if !is_null(.path) && is_string(.path) {
        filename_parsed = parse_grok!(.path, "%{GREEDYDATA}/%{NOTSPACE:filename}")
        if filename_parsed != null && filename_parsed.filename != null {
          .filename = filename_parsed.filename
        }
      }

      if !is_null(.message) && is_string(.message) {
        message_value = .message
        parsed = parse_grok!(message_value, ".*(?i)product\\\":\\\"%{NOTSPACE:product}\\\"")
        if parsed != null && parsed.product != null {
          .product = parsed.product
        }

        parsed = parse_grok!(message_value, ".*(?i)layer\\\":\\\"%{NOTSPACE:layer}\\\"")
        if parsed != null && parsed.layer != null {
          .layer = parsed.layer
        }

        if is_null(.maskGroupId) {
          parsed = parse_grok!(message_value, ".*(?i)mask_?group_?id\\\":\\\"%{NOTSPACE:maskGroupId}\\\"")
          if parsed != null && parsed.maskGroupId != null {
            .maskGroupId = parsed.maskGroupId
          }
        }

        if is_null(.maskGroupId) {
          parsed = parse_grok!(message_value, ".*(?i)maskGroupId-> %{NOTSPACE:maskGroupId}")
          if parsed != null && parsed.maskGroupId != null {
            .maskGroupId = parsed.maskGroupId
          }
        }

        if is_null(.maskGroupId) {
          parsed = parse_grok!(message_value, ".*(?i)reticleId=\\\"%{NOTSPACE:maskGroupId}\\\">")
          if parsed != null && parsed.maskGroupId != null {
            .maskGroupId = parsed.maskGroupId
          }
        }

        if is_null(.maskGroupId) {
          parsed = parse_grok!(message_value, ".*(?i)reticle_?id\\\":\\\"%{NOTSPACE:maskGroupId}\\\"")
          if parsed != null && parsed.maskGroupId != null {
            .maskGroupId = parsed.maskGroupId
          }
        }

        if is_null(.maskGroupId) {
          parsed = parse_grok!(message_value, ".*(?i)reticlelotid -> %{NOTSPACE:maskGroupId}")
          if parsed != null && parsed.maskGroupId != null {
            .maskGroupId = parsed.maskGroupId
          }
        }

        if is_null(.Action) {
          parsed = parse_grok!(message_value, ".*(?i)Action\\\":\\\"%{NOTSPACE:Action}:%{NOTSPACE:maskGroupId}\\\"")
          if parsed != null && parsed.Action != null {
            .Action = parsed.Action
            if is_null(.maskGroupId) && parsed.maskGroupId != null {
              .maskGroupId = parsed.maskGroupId
            }
          }
        }

        if is_null(.Action) {
          parsed = parse_grok!(message_value, ".*(?i)Action\\\":\\\"%{NOTSPACE:Action}\\\"")
          if parsed != null && parsed.Action != null {
            .Action = parsed.Action
          }
        }

        if is_null(.maskLotId) {
          parsed = parse_grok!(message_value, ".*(?i)mask_?lot_?id\\\":\\\"%{NOTSPACE:maskLotId}\\\"")
          if parsed != null && parsed.maskLotId != null {
            .maskLotId = parsed.maskLotId
          }
        }

        if is_null(.maskLotId) {
          parsed = parse_grok!(message_value, ".*(?i)maskLotId->%{NOTSPACE:maskLotId}")
          if parsed != null && parsed.maskLotId != null {
            .maskLotId = parsed.maskLotId
          }
        }

        if is_null(.maskLotId) {
          parsed = parse_grok!(message_value, ".*(?i)maskLotId-> %{NOTSPACE:maskLotId}")
          if parsed != null && parsed.maskLotId != null {
            .maskLotId = parsed.maskLotId
          }
        }

        if is_null(.maskLotId) {
          parsed = parse_grok!(message_value, ".*(?i)maskLotId = '%{NOTSPACE:maskLotId}'")
          if parsed != null && parsed.maskLotId != null {
            .maskLotId = parsed.maskLotId
          }
        }

        if is_null(.MaskListNo) {
          parsed = parse_grok!(message_value, "MaskListNo=%{NUMBER:MaskListNo}")
          if parsed != null && parsed.MaskListNo != null {
            .MaskListNo = parsed.MaskListNo
          }
        }

        if is_null(.rqstType) {
          parsed = parse_grok!(message_value, "rqstType\\\":\\\"%{NOTSPACE:rqstType}\\\"")
          if parsed != null && parsed.rqstType != null {
            .rqstType = parsed.rqstType
          }
        }

        if is_null(.IsQueryPhase) {
          parsed = parse_grok!(message_value, "IsQueryPhase\\\":\\\"%{NOTSPACE:IsQueryPhase}\\\"")
          if parsed != null && parsed.IsQueryPhase != null {
            .IsQueryPhase = parsed.IsQueryPhase
          }
        }

        if is_null(.srvObjCategory) {
          parsed = parse_grok!(message_value, "srvObjCategory\\\":\\\"%{NOTSPACE:srvObjCategory}\\\"")
          if parsed != null && parsed.srvObjCategory != null {
            .srvObjCategory = parsed.srvObjCategory
          }
        }

        if is_null(.srvMethod) {
          parsed = parse_grok!(message_value, "srvMethod\\\":\\\"%{NOTSPACE:srvMethod}\\\"")
          if parsed != null && parsed.srvMethod != null {
            .srvMethod = parsed.srvMethod
          }
        }

        if is_null(.Purge_Tool) {
          parsed = parse_grok!(message_value, "purge_tool\\\":\\\"%{NOTSPACE:Purge_Tool}\\\"")
          if parsed != null && parsed.Purge_Tool != null {
            .Purge_Tool = parsed.Purge_Tool
          }
        }
      }

      if is_null(.maskGroupId) {
        .MGtag = "null"
      }

      if is_null(.product) {
        .Ptag = "null"
      }

      if is_null(.layer) {
        .Ltag = "null"
      }

      if .MGtag == "null" && .Ptag != "null" && .Ltag != "null" {
        product_str, err = to_string(.product)
        layer_str, err = to_string(.layer)
        if product_str != null && layer_str != null {
          .maskGroupId = product_str + "-" + layer_str
        }
      }

      if !is_null(.MaskListNo) {
        .MaskListNo = to_int!(.MaskListNo)
      }

      query_phase = false
      if !is_null(.IsQueryPhase) {
        is_query_phase_str, err = to_string(.IsQueryPhase)
        if is_query_phase_str != null && contains(is_query_phase_str, "Y") {
          query_phase = true
        }
      }

      if !query_phase && !is_null(.rqstType) {
        rqst_type_str, err = to_string(.rqstType)
        if rqst_type_str != null && contains(rqst_type_str, "PHASE") {
          query_phase = true
        }
      }

      if query_phase {
        del(.maskLotId)
        del(.maskGroupId)
        del(.product)
        del(.layer)
      }

sinks:
  elasticsearch_output:
    type: elasticsearch
    inputs:
      - parse_fields
    endpoints:
      - http://elasticsearch-fz1.engmon.svc.cluster.local:9200
    auth:
      strategy: basic
      user: "${ELASTICSEARCH_USER:-elastic}"
      password: "${ELASTICSEARCH_PASSWORD:-changeme}"
    tls:
      verify_certificate: true
    bulk:
      index: "{{ POD_NAMESPACE }}-%Y.%m.%d"
    batch:
      timeout_secs: 5
      max_bytes: 8000000
    buffer:
      type: memory
      when_full: block
      max_events: 1000
    request:
      timeout_secs: 10
      retry_max_duration_secs: 3600
    healthcheck:
      enabled: false
