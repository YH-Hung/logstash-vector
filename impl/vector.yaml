data_dir: tmp/vector

sources:
  # Vector's own operational metrics (CPU, events, errors), exposed on the same /metrics endpoint
  internal_metrics:
    type: internal_metrics

  ap_log_files:
    type: file
    include:
      - /app/log/web_*.log
    read_from: end
    file_key: path

  grpc_log_files:
    type: file
    include:
      - /app/log/grpc_*.log
    read_from: end
    file_key: path

transforms:
  # Step 0: Aggregate multiline AP log records after file ingestion
  ap_multiline_reduce:
    type: reduce
    inputs:
      - ap_log_files
    group_by:
      - path
    starts_when: 'match(to_string!(.message), r''^\[.*\]\s\s\s\[.*\]\s\[TRACE\]\sbefore\sSysUuid::set\(\):\scurSysUuid=.*'')'
    expire_after_ms: 1000
    flush_period_ms: 100
    merge_strategies:
      message: concat_newline
      path: retain

  # Step 1: Static field enrichment
  enrich_static:
    type: remap
    inputs:
      - ap_multiline_reduce
    file: impl/vrl/01_enrich_static.vrl

  # Step 2: Extract filename from path
  parse_filename:
    type: remap
    inputs:
      - enrich_static
    file: impl/vrl/02_parse_filename.vrl

  # Step 3: Extract product and layer from message
  parse_core_fields:
    type: remap
    inputs:
      - parse_filename
    file: impl/vrl/03_parse_core_fields.vrl

  # Step 4: Extract maskGroupId with multiple fallback patterns
  parse_mask_group_id:
    type: remap
    inputs:
      - parse_core_fields
    file: impl/vrl/04_parse_mask_group_id.vrl

  # Step 5: Extract Action field (may also extract maskGroupId)
  parse_action:
    type: remap
    inputs:
      - parse_mask_group_id
    file: impl/vrl/05_parse_action.vrl

  # Step 6: Extract maskLotId with multiple fallback patterns
  parse_mask_lot_id:
    type: remap
    inputs:
      - parse_action
    file: impl/vrl/06_parse_mask_lot_id.vrl

  # Step 7: Extract remaining fields (MaskListNo, rqstType, IsQueryPhase, etc.)
  parse_other_fields:
    type: remap
    inputs:
      - parse_mask_lot_id
    file: impl/vrl/07_parse_other_fields.vrl

  # Step 8: Derive fields, type conversions, and query phase cleanup
  derive_and_cleanup:
    type: remap
    inputs:
      - parse_other_fields
    file: impl/vrl/08_derive_and_cleanup.vrl

  # gRPC log pipeline: parse glog/gpr-style lines into structured fields
  parse_grpc_log:
    type: remap
    inputs:
      - grpc_log_files
    file: impl/vrl/09_parse_grpc_log.vrl
    drop_on_abort: true
    drop_on_error: true

  # gRPC metrics. NOTE: error/fatal lines are intentionally counted in BOTH
  # grpc_log_messages_total (overall rate) and grpc_log_errors_total (alerting).
  grpc_error_log_filter:
    type: filter
    inputs:
      - parse_grpc_log
    condition: '.grpc_severity == "error" || .grpc_severity == "fatal"'

  # Count every parsed gRPC line, tagged by severity + source file
  grpc_log_message_metrics:
    type: log_to_metric
    inputs:
      - parse_grpc_log
    metrics:
      - type: counter
        field: grpc_severity
        name: grpc_log_messages_total
        tags:
          severity: "{{ grpc_severity }}"
          severity_code: "{{ grpc_severity_code }}"
          file: "{{ grpc_file }}"

  # Count only error/fatal lines (from the filter above)
  grpc_log_error_metrics:
    type: log_to_metric
    inputs:
      - grpc_error_log_filter
    metrics:
      - type: counter
        field: grpc_severity
        name: grpc_log_errors_total
        tags:
          severity: "{{ grpc_severity }}"
          file: "{{ grpc_file }}"

sinks:
  elasticsearch_output:
    type: elasticsearch
    inputs:
      - derive_and_cleanup
    endpoints:
      - http://elasticsearch-fz1.engmon.svc.cluster.local:9200
    auth:
      strategy: basic
      user: "${ELASTICSEARCH_USER:-elastic}"
      password: "${ELASTICSEARCH_PASSWORD:-changeme}"
    tls:
      verify_certificate: true
    bulk:
      index: "{{ POD_NAMESPACE }}-%Y.%m.%d"
    batch:
      timeout_secs: 5
      max_bytes: 8000000
    buffer:
      type: memory
      when_full: block
      max_events: 1000
    request:
      timeout_secs: 10
      retry_max_duration_secs: 3600
    healthcheck:
      enabled: false

  # Console sink for local testing - outputs to stdout
  console_output:
    type: console
    inputs:
      - derive_and_cleanup
    encoding:
      codec: json

  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - internal_metrics
      - grpc_log_message_metrics
      - grpc_log_error_metrics
    address: "0.0.0.0:9598"
    # Keep low-frequency counters (e.g. rare gRPC errors) visible across multiple
    # scrape cycles; must be larger than Prometheus' scrape interval.
    flush_period_secs: 300

tests:
  # ============================================================================
  # Step 0: ap_multiline_reduce tests
  # ============================================================================
  - name: "Unit: ap_multiline_reduce - aggregates lines until next start"
    inputs:
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:33:130]   [a027d5c0-8560-49e7-8f82-70901077a4bf] [TRACE] before SysUuid::set(): curSysUuid=a027d5c0-8560-49e7-8f82-70901077a4bf, preSysUuid='
          path: /app/log/web_hmib_1.log
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:33:166]   [8e475fe2-0680-41f2-b734-20cd691d05f9] Rqst_DisplayInfo {"mask_lot_id":"EBGN29J.1"}'
          path: /app/log/web_hmib_1.log
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:33:211]   [8e475fe2-0680-41f2-b734-20cd691d05f9] Rep_DisplayInfo "mask_group_id":"TMEF78-376A-M001" "product":"TMEF78" "layer":"376A-M001"'
          path: /app/log/web_hmib_1.log
    outputs:
      - extract_from: ap_multiline_reduce
        conditions:
          - type: vrl
            source: |
              assert!(contains!(.message, "before SysUuid::set()"))
              assert!(contains!(.message, "Rqst_DisplayInfo"))
              assert!(contains!(.message, "Rep_DisplayInfo"))
              assert!(contains!(.message, "\n"))
              assert_eq!(length(split(to_string!(.message), "\n")), 3)

  - name: "Unit: ap_multiline_reduce - second start opens a new group"
    inputs:
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:33:130]   [grp1] [TRACE] before SysUuid::set(): curSysUuid=grp1, preSysUuid='
          path: /app/log/web_hmib_1.log
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:33:166]   [grp1] Rqst_DisplayInfo group-one-body'
          path: /app/log/web_hmib_1.log
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:34:200]   [grp2] [TRACE] before SysUuid::set(): curSysUuid=grp2, preSysUuid=grp1'
          path: /app/log/web_hmib_1.log
      - insert_at: ap_multiline_reduce
        type: log
        log_fields:
          message: '[2026-01-16 09:10:34:240]   [grp2] Rqst_DisplayInfo group-two-body'
          path: /app/log/web_hmib_1.log
    outputs:
      - extract_from: ap_multiline_reduce
        conditions:
          - type: vrl
            source: |
              # First group (grp1): the second start-pattern line must have closed it,
              # so it contains group-one-body but NOT group-two-body.
              assert!(contains!(.message, "curSysUuid=grp1"))
              assert!(contains!(.message, "group-one-body"))
              assert!(!contains!(.message, "group-two-body"))
              assert!(contains!(.message, "\n"))

  # ============================================================================
  # Step 1: enrich_static tests
  # ============================================================================
  - name: "Unit: enrich_static - sets system and type"
    inputs:
      - insert_at: enrich_static
        type: log
        log_fields:
          message: "test message"
    outputs:
      - extract_from: enrich_static
        conditions:
          - type: vrl
            source: |
              assert_eq!(.system, "legendary")
              assert_eq!(.type, "ap_log")
              assert_eq!(.message, "test message")

  - name: "Unit: enrich_static - preserves existing fields"
    inputs:
      - insert_at: enrich_static
        type: log
        log_fields:
          message: "test message"
          custom_field: "custom_value"
    outputs:
      - extract_from: enrich_static
        conditions:
          - type: vrl
            source: |
              assert_eq!(.system, "legendary")
              assert_eq!(.type, "ap_log")
              assert_eq!(.custom_field, "custom_value")

  # ============================================================================
  # Step 2: parse_filename tests
  # ============================================================================
  - name: "Unit: parse_filename - extracts filename from path"
    inputs:
      - insert_at: parse_filename
        type: log
        log_fields:
          path: "/app/log/web_hmib_1.log"
    outputs:
      - extract_from: parse_filename
        conditions:
          - type: vrl
            source: |
              assert_eq!(.filename, "web_hmib_1.log")

  - name: "Unit: parse_filename - handles missing path"
    inputs:
      - insert_at: parse_filename
        type: log
        log_fields:
          message: "no path field"
    outputs:
      - extract_from: parse_filename
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.filename))

  - name: "Unit: parse_filename - handles nested path"
    inputs:
      - insert_at: parse_filename
        type: log
        log_fields:
          path: "/var/log/app/nested/web_test.log"
    outputs:
      - extract_from: parse_filename
        conditions:
          - type: vrl
            source: |
              assert_eq!(.filename, "web_test.log")

  # ============================================================================
  # Step 3: parse_core_fields tests
  # ============================================================================
  - name: "Unit: parse_core_fields - extracts product and layer"
    inputs:
      - insert_at: parse_core_fields
        type: log
        log_fields:
          message: '"product":"TMEF78" "layer":"376A-M001"'
    outputs:
      - extract_from: parse_core_fields
        conditions:
          - type: vrl
            source: |
              assert_eq!(.product, "TMEF78")
              assert_eq!(.layer, "376A-M001")

  - name: "Unit: parse_core_fields - handles missing message"
    inputs:
      - insert_at: parse_core_fields
        type: log
        log_fields:
          path: "/app/log/web_test.log"
    outputs:
      - extract_from: parse_core_fields
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.product))
              assert!(!exists(.layer))

  - name: "Unit: parse_core_fields - case insensitive matching"
    inputs:
      - insert_at: parse_core_fields
        type: log
        log_fields:
          message: '"PRODUCT":"ABC123" "LAYER":"XYZ"'
    outputs:
      - extract_from: parse_core_fields
        conditions:
          - type: vrl
            source: |
              assert_eq!(.product, "ABC123")
              assert_eq!(.layer, "XYZ")

  # ============================================================================
  # Step 4: parse_mask_group_id tests
  # ============================================================================
  - name: "Unit: parse_mask_group_id - pattern mask_group_id"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: '"mask_group_id":"TMEF78-376A-M001"'
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "TMEF78-376A-M001")

  - name: "Unit: parse_mask_group_id - pattern maskGroupId->"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: "maskGroupId-> MG001"
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "MG001")

  - name: "Unit: parse_mask_group_id - pattern reticleId"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: 'reticleId="MG002">'
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "MG002")

  - name: "Unit: parse_mask_group_id - pattern reticle_id"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: '"reticle_id":"MG003"'
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "MG003")

  - name: "Unit: parse_mask_group_id - pattern reticlelotid"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: "reticlelotid -> MG004"
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "MG004")

  - name: "Unit: parse_mask_group_id - no match"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: "no maskGroupId here"
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.maskGroupId))

  - name: "Unit: parse_mask_group_id - preserves existing maskGroupId"
    inputs:
      - insert_at: parse_mask_group_id
        type: log
        log_fields:
          message: '"mask_group_id":"NEW_VALUE"'
          maskGroupId: "EXISTING_VALUE"
    outputs:
      - extract_from: parse_mask_group_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "EXISTING_VALUE")

  # ============================================================================
  # Step 5: parse_action tests
  # ============================================================================
  - name: "Unit: parse_action - action with maskGroupId"
    inputs:
      - insert_at: parse_action
        type: log
        log_fields:
          message: '"Action":"CREATE:MG001"'
    outputs:
      - extract_from: parse_action
        conditions:
          - type: vrl
            source: |
              assert_eq!(.Action, "CREATE")
              assert_eq!(.maskGroupId, "MG001")

  - name: "Unit: parse_action - action only"
    inputs:
      - insert_at: parse_action
        type: log
        log_fields:
          message: '"Action":"DELETE"'
    outputs:
      - extract_from: parse_action
        conditions:
          - type: vrl
            source: |
              assert_eq!(.Action, "DELETE")

  - name: "Unit: parse_action - no match"
    inputs:
      - insert_at: parse_action
        type: log
        log_fields:
          message: "no action here"
    outputs:
      - extract_from: parse_action
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.Action))

  - name: "Unit: parse_action - preserves existing maskGroupId"
    inputs:
      - insert_at: parse_action
        type: log
        log_fields:
          message: '"Action":"UPDATE:NEW_MG"'
          maskGroupId: "EXISTING_MG"
    outputs:
      - extract_from: parse_action
        conditions:
          - type: vrl
            source: |
              assert_eq!(.Action, "UPDATE")
              assert_eq!(.maskGroupId, "EXISTING_MG")

  # ============================================================================
  # Step 6: parse_mask_lot_id tests
  # ============================================================================
  - name: "Unit: parse_mask_lot_id - pattern mask_lot_id"
    inputs:
      - insert_at: parse_mask_lot_id
        type: log
        log_fields:
          message: '"mask_lot_id":"EBGN29J.1"'
    outputs:
      - extract_from: parse_mask_lot_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskLotId, "EBGN29J.1")

  - name: "Unit: parse_mask_lot_id - pattern maskLotId->"
    inputs:
      - insert_at: parse_mask_lot_id
        type: log
        log_fields:
          message: "maskLotId->ML001"
    outputs:
      - extract_from: parse_mask_lot_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskLotId, "ML001")

  - name: "Unit: parse_mask_lot_id - pattern maskLotId-> with space"
    inputs:
      - insert_at: parse_mask_lot_id
        type: log
        log_fields:
          message: "maskLotId-> ML002"
    outputs:
      - extract_from: parse_mask_lot_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskLotId, "ML002")

  - name: "Unit: parse_mask_lot_id - pattern MASKLOTID ="
    inputs:
      - insert_at: parse_mask_lot_id
        type: log
        log_fields:
          message: "MASKLOTID = 'EBGN29J.1'"
    outputs:
      - extract_from: parse_mask_lot_id
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskLotId, "EBGN29J.1")

  - name: "Unit: parse_mask_lot_id - no match"
    inputs:
      - insert_at: parse_mask_lot_id
        type: log
        log_fields:
          message: "no maskLotId here"
    outputs:
      - extract_from: parse_mask_lot_id
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.maskLotId))

  # ============================================================================
  # Step 7: parse_other_fields tests
  # ============================================================================
  - name: "Unit: parse_other_fields - extracts all fields"
    inputs:
      - insert_at: parse_other_fields
        type: log
        log_fields:
          message: 'MaskListNo=123 "rqstType":"QUERY" "IsQueryPhase":"N" "srvObjCategory":"MASK" "srvMethod":"GET_MASK_INFO" "purge_tool":"PURGE_V1"'
    outputs:
      - extract_from: parse_other_fields
        conditions:
          - type: vrl
            source: |
              assert_eq!(.MaskListNo, "123")
              assert_eq!(.rqstType, "QUERY")
              assert_eq!(.IsQueryPhase, "N")
              assert_eq!(.srvObjCategory, "MASK")
              assert_eq!(.srvMethod, "GET_MASK_INFO")
              assert_eq!(.Purge_Tool, "PURGE_V1")

  - name: "Unit: parse_other_fields - partial fields"
    inputs:
      - insert_at: parse_other_fields
        type: log
        log_fields:
          message: 'MaskListNo=456 "IsQueryPhase":"Y"'
    outputs:
      - extract_from: parse_other_fields
        conditions:
          - type: vrl
            source: |
              assert_eq!(.MaskListNo, "456")
              assert_eq!(.IsQueryPhase, "Y")
              assert!(!exists(.rqstType))
              assert!(!exists(.srvObjCategory))

  - name: "Unit: parse_other_fields - no fields"
    inputs:
      - insert_at: parse_other_fields
        type: log
        log_fields:
          message: "no special fields here"
    outputs:
      - extract_from: parse_other_fields
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.MaskListNo))
              assert!(!exists(.rqstType))
              assert!(!exists(.IsQueryPhase))

  # ============================================================================
  # Step 8: derive_and_cleanup tests
  # ============================================================================
  - name: "Unit: derive_and_cleanup - derives maskGroupId from product and layer"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          product: "TMEF78"
          layer: "376A-M001"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert_eq!(.MGtag, "null")
              assert_eq!(.maskGroupId, "TMEF78-376A-M001")
              assert!(!exists(.Ptag))
              assert!(!exists(.Ltag))

  - name: "Unit: derive_and_cleanup - MaskListNo to int"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          MaskListNo: "123"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert_eq!(.MaskListNo, 123)
              assert!(is_integer(.MaskListNo))

  - name: "Unit: derive_and_cleanup - query phase IsQueryPhase Y"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          maskGroupId: "MG001"
          maskLotId: "ML001"
          product: "PROD"
          layer: "LAYER"
          IsQueryPhase: "Y"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.maskLotId))
              assert!(!exists(.maskGroupId))
              assert!(!exists(.product))
              assert!(!exists(.layer))

  - name: "Unit: derive_and_cleanup - query phase rqstType PHASE"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          maskGroupId: "MG001"
          maskLotId: "ML001"
          product: "PROD"
          layer: "LAYER"
          rqstType: "QUERY_PHASE"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.maskLotId))
              assert!(!exists(.maskGroupId))
              assert!(!exists(.product))
              assert!(!exists(.layer))

  - name: "Unit: derive_and_cleanup - no query phase preserves fields"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          maskGroupId: "MG001"
          maskLotId: "ML001"
          product: "PROD"
          layer: "LAYER"
          IsQueryPhase: "N"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskLotId, "ML001")
              assert_eq!(.maskGroupId, "MG001")
              assert_eq!(.product, "PROD")
              assert_eq!(.layer, "LAYER")

  - name: "Unit: derive_and_cleanup - sets all null tags when fields missing"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          message: "no special fields"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert_eq!(.MGtag, "null")
              assert_eq!(.Ptag, "null")
              assert_eq!(.Ltag, "null")

  - name: "Unit: derive_and_cleanup - renames timestamp to @timestamp with Asia/Taipei timezone"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          message: "test message"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.timestamp), "original .timestamp field should be removed")
              assert!(exists(."@timestamp"), "@timestamp field should exist")
              ts_str = to_string!(."@timestamp")
              assert!(contains(ts_str, "+08:00"), "@timestamp should have Asia/Taipei offset (+08:00)")

  - name: "Unit: derive_and_cleanup - timestamp rename coexists with field derivation"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          product: "TMEF78"
          layer: "376A-M001"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert_eq!(.maskGroupId, "TMEF78-376A-M001")
              assert!(!exists(.timestamp))
              assert!(exists(."@timestamp"))
              ts_str = to_string!(."@timestamp")
              assert!(contains(ts_str, "+08:00"))

  - name: "Unit: derive_and_cleanup - query phase cleanup coexists with timestamp rename"
    inputs:
      - insert_at: derive_and_cleanup
        type: log
        log_fields:
          maskGroupId: "MG001"
          IsQueryPhase: "Y"
    outputs:
      - extract_from: derive_and_cleanup
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.maskGroupId))
              assert!(!exists(.timestamp))
              assert!(exists(."@timestamp"))
              ts_str = to_string!(."@timestamp")
