input {
    file {
        type => "ap_log"
        path => "/app/log/web_*.log"
        start_position => "end"

        add_field => { "system" => "ledgendary" }
    }
}

filter {
    grok {
        match => ["path", "%{GREEDYDATA}/%{NOTSPACE:filename}"]
    }

    if [type] == "ap_log" {
        multiline {
            pattern => "\[%{DATA}\]\s\s\s\[%{DATA}\]\s\[TRACE\]\sbefore\sSysUuid::set():\scurSysUuid=%{GREEDYDATA}"
            negate => true
            what => "previous"
        }
    }
    grok {
        match => ["message", ".*(?i)\"product\":\"%{NOTSPACE:product}\""]
    }
    grok {
        match => ["message", ".*(?i)\"layer\":\"%{NOTSPACE:layer}\""]
    }
    grok {
        match => [
            "message", ".*(?i)\"mask_?group_?id\":\"%{NOTSPACE:maskGroupId}\"",
            "message", ".*(?i)maskGroupId->\s%{NOTSPACE:maskGroupId}",
            "message", ".*(?i)reticleId=\"%{NOTSPACE:maskGroupId}\"\>",
            "message", ".*(?i)\"reticle_?id\":\"%{NOTSPACE:maskGroupId}\"",
            "message", ".*(?i)reticlelotid\s->\s%{NOTSPACE:maskGroupId}"
        ]
    }
    grok {
        match => [
            "message", ".*(?i)Action:\"%{NOTSPACE:Action}\:%{NOTSPACE:maskGroupId}\"",
            "message", ".*(?i)Action:\"%{NOTSPACE:Action}\""
        ]
    }
    ruby {
        code => "
            begin
                if event.get('maskGroupId').nil? then
                    event.set('MGtag', 'null')
                end
                if event.get('product').nil? then
                    event.set('Ptag', 'null')
                end
                if event.get('layer').nil? then
                    event.set('Ltag', 'null')
                end
            end
        "
    }
    if [MGtag] == "null" and [Ptag] != "null" and [Ltag] != "null" {
        mutate {
            add_field => {"maskGroupId" => "%{product}-%{layer}"}
        }
    }
    grok {
        match => [
            "message", ".*(?i)\"mask_?lot_?id\":\"%{NOTSPACE:maskLotId}\"",
            "message", ".*(?i)maskLotId->%{NOTSPACE:maskLotId}",
            "message", ".*(?i)maskLotId->\s%{NOTSPACE:maskLotId}",
            "message", ".*(?i)maskLotId\s=\s\'%{NOTSPACE:maskLotId}\'"
        ]
    }
    grok {
        match => ["message", "MaskListNo=%{NUMBER:MaskListNo}"]
    }
    mutate {
        convert => ["MaskListNo", "integer"]
    }
    grok {
        match => ["message", "rqstType:\"%{NOTSPACE:rqstType}\""]
    }
    grok {
        match => ["message", "IsQueryPhase:\"%{NOTSPACE:IsQueryPhase}\""]
    }
    if "Y" in [IsQueryPhase] or "PHASE" in [rqstType] {
        mutate {
            remove_field => [maskLotId]
            remove_field => [maskGroupId]
            remove_field => [product]
            remove_field => [layer]
        }
    }
    grok {
        match => ["message", "srvObjCategory:\"%{NOTSPACE:srvObjCategory}\""]
    }
    grok {
        match => ["message", "srvMethod:\"%{NOTSPACE:srvMethod}\""]
    }
    grok {
        match => ["message", "purge_tool:\"%{NOTSPACE:Purge_Tool}\""]
    }
}
