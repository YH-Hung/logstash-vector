version: '3.8'

services:
  # Logstash service for testing original configs
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: test-logstash
    volumes:
      - ./test-data/logstash:/usr/share/logstash/pipeline:ro
      - ./test-data/logs:/var/log/test:ro
      - ./test-data/output/logstash:/var/log/output
    environment:
      - "LS_JAVA_OPTS=-Xmx512m -Xms512m"
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
    networks:
      - test-network
    depends_on:
      - elasticsearch
    command: logstash -f /usr/share/logstash/pipeline/file-input.conf

  # Vector service for testing migrated configs
  vector:
    image: timberio/vector:0.34.1-alpine
    container_name: test-vector
    volumes:
      - ./test-data/vector:/etc/vector:ro
      - ./test-data/logs:/var/log/test:ro
      - ./test-data/output/vector:/var/log/output
    networks:
      - test-network
    depends_on:
      - elasticsearch
    command: --config /etc/vector/file-input.toml

  # Elasticsearch for output testing
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: test-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Test runner for Python integration tests
  test-runner-py:
    build:
      context: ./lv-py
      dockerfile: Dockerfile.test
    container_name: test-runner-py
    volumes:
      - ./lv-py:/app:ro
      - ./test-data:/test-data
      - ./test-results/py:/test-results
    networks:
      - test-network
    depends_on:
      - logstash
      - vector
      - elasticsearch
    command: pytest tests/integration -v --tb=short
    profiles:
      - test-py

  # Test runner for Go integration tests
  test-runner-go:
    build:
      context: ./lv-go
      dockerfile: Dockerfile.test
    container_name: test-runner-go
    volumes:
      - ./lv-go:/app:ro
      - ./test-data:/test-data
      - ./test-results/go:/test-results
    networks:
      - test-network
    depends_on:
      - logstash
      - vector
      - elasticsearch
    command: go test ./... -v
    profiles:
      - test-go

networks:
  test-network:
    driver: bridge

volumes:
  test-output:
