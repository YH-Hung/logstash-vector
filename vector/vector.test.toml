[sources.file_input]
type = "file"
include = ["/app/log/web_*.log"]
read_from = "beginning"

[sources.file_input.multiline]
start_pattern = '^\[[^\]]+\]\s{3}\[[^\]]+\]\s\[TRACE\]\sbefore\sSysUuid::set\(\):\scurSysUuid=[^\s]+'
mode = "halt_before"
condition_pattern = '^\[[^\]]+\]\s{3}\[[^\]]+\]\s\[TRACE\]\sbefore\sSysUuid::set\(\):\scurSysUuid=[^\s]+'
timeout_ms = 5000

[transforms.add_system_field]
type = "remap"
inputs = ["file_input"]
source = '''
.system = "legendary"
'''

[transforms.parse_filename]
type = "remap"
inputs = ["add_system_field"]
source = '''
result, err = parse_grok(string!(.file), "%{GREEDYDATA}/%{NOTSPACE:filename}")
if err == null && is_object(result) {
    .filename = result.filename
}
'''

[transforms.field_parser]
type = "remap"
inputs = ["parse_filename"]
source = '''
# Primary fields - single pattern
result, err = parse_grok(string!(.message), ".*(?i)product:\\\"%{NOTSPACE:product}\\\"")
if err == null && is_object(result) {
    .product = result.product
}

result, err = parse_grok(string!(.message), ".*(?i)layer:\\\"%{NOTSPACE:layer}\\\"")
if err == null && is_object(result) {
    .layer = result.layer
}

# maskGroupId - 5 fallback patterns
result, err = parse_grok(string!(.message), ".*(?i)mask_?group_?id:\\\"%{NOTSPACE:maskGroupId}\\\"")
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)maskGroupId->\\s%{NOTSPACE:maskGroupId}")
}
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)reticleId=\\\"%{NOTSPACE:maskGroupId}\\\"\\>")
}
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)reticle_?id:\\\"%{NOTSPACE:maskGroupId}\\\"")
}
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)reticlelotid\\s->\\s%{NOTSPACE:maskGroupId}")
}
if err == null && is_object(result) {
    .maskGroupId = result.maskGroupId
}

# Action - 2 patterns
result, err = parse_grok(string!(.message), ".*(?i)Action:\\\"%{NOTSPACE:Action}\\:%{NOTSPACE:maskGroupId}\\\"")
if err == null && is_object(result) {
    .Action = result.Action
    if !exists(.maskGroupId) {
        .maskGroupId = result.maskGroupId
    }
} else {
    result, err = parse_grok(string!(.message), ".*(?i)Action:\\\"%{NOTSPACE:Action}\\\"")
    if err == null && is_object(result) {
        .Action = result.Action
    }
}

# maskLotId - 4 patterns
result, err = parse_grok(string!(.message), ".*(?i)mask_?lot_?id:\\\"%{NOTSPACE:maskLotId}\\\"")
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)maskLotId->%{NOTSPACE:maskLotId}")
}
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)maskLotId->\\s%{NOTSPACE:maskLotId}")
}
if err != null || !is_object(result) {
    result, err = parse_grok(string!(.message), ".*(?i)maskLotId\\s=\\s\\'%{NOTSPACE:maskLotId}\\'")
}
if err == null && is_object(result) {
    .maskLotId = result.maskLotId
}

# Simple fields
result, err = parse_grok(string!(.message), "MaskListNo=%{NUMBER:MaskListNo}")
if err == null && is_object(result) {
    .MaskListNo = result.MaskListNo
}

result, err = parse_grok(string!(.message), "rqstType:\\\"%{NOTSPACE:rqstType}\\\"")
if err == null && is_object(result) {
    .rqstType = result.rqstType
}

result, err = parse_grok(string!(.message), "IsQueryPhase:\\\"%{NOTSPACE:IsQueryPhase}\\\"")
if err == null && is_object(result) {
    .IsQueryPhase = result.IsQueryPhase
}

result, err = parse_grok(string!(.message), "srvObjCategory:\\\"%{NOTSPACE:srvObjCategory}\\\"")
if err == null && is_object(result) {
    .srvObjCategory = result.srvObjCategory
}

result, err = parse_grok(string!(.message), "srvMethod:\\\"%{NOTSPACE:srvMethod}\\\"")
if err == null && is_object(result) {
    .srvMethod = result.srvMethod
}

result, err = parse_grok(string!(.message), "purge_tool:\\\"%{NOTSPACE:Purge_Tool}\\\"")
if err == null && is_object(result) {
    .Purge_Tool = result.Purge_Tool
}
'''

[transforms.processing_logic]
type = "remap"
inputs = ["field_parser"]
source = '''
# Tag management - set tags to "null" if fields are missing
if !exists(.maskGroupId) {
    .MGtag = "null"
}
if !exists(.product) {
    .Ptag = "null"
}
if !exists(.layer) {
    .Ltag = "null"
}

# Field combination - combine product and layer into maskGroupId if needed
if .MGtag == "null" && .Ptag != "null" && .Ltag != "null" {
    .maskGroupId = string!(.product) + "-" + string!(.layer)
}

# Type conversion - convert MaskListNo to integer
if exists(.MaskListNo) {
    .MaskListNo = to_int!(.MaskListNo)
}

# Conditional field removal - remove fields if IsQueryPhase == "Y" or rqstType contains "PHASE"
rqst_type_str = ""
if exists(.rqstType) {
    rqst_type_str = string!(.rqstType)
}
if (exists(.IsQueryPhase) && .IsQueryPhase == "Y") || (rqst_type_str != "" && contains(rqst_type_str, "PHASE")) {
    del(.maskLotId)
    del(.maskGroupId)
    del(.product)
    del(.layer)
}
'''

[sinks.file_output]
type = "file"
inputs = ["processing_logic"]
path = "/output/vector_output.jsonl"
encoding.codec = "json"
