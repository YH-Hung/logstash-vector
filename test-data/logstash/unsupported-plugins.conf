input {
  file {
    path => "/var/log/app.log"
  }

  # Unsupported input plugin
  jdbc {
    jdbc_connection_string => "jdbc:mysql://localhost:3306/db"
    jdbc_user => "user"
    statement => "SELECT * FROM logs"
  }
}

filter {
  # Supported filter
  mutate {
    add_field => { "migrated" => "true" }
  }

  # Unsupported filter
  ruby {
    code => "event.set('custom', Time.now.to_i)"
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
  }

  # Unsupported output
  kafka {
    topic_id => "logs"
    bootstrap_servers => "localhost:9092"
  }
}
