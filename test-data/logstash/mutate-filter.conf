input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    remove_field => ["temp_field", "debug_field"]
    rename => { "old_name" => "new_name" }
    add_field => { "environment" => "production" }
    convert => { "response_time" => "integer" }
  }
}

output {
  file {
    path => "/var/log/processed.log"
  }
}
